# kahlnws: a bare primal network simplex for the min-cost flow problem on exact integers. One problem in, borrowed as
# plain slices, and one optimal flow out, or the answer that no flow exists.
#
# Four crates under `crates/`, every edge pointing down: `kahlnws`, the library itself, which depends on no other
# crate of this workspace; `kahlnws_capi`, the C boundary over it, built as a static and a dynamic library with the
# header `include/kahlnws.h` it writes at build time; `kahlnws_python`, the Python binding over it, the extension
# module of the Python package `kahlnws` that maturin builds from its `pyproject.toml`; and `kahlnws_testing`, the
# test infrastructure the tests and benchmarks of the library, the C boundary and the Python binding share, a
# dev-dependency only and never published. A dependency nothing builds is not declared.
#
# The Python binding builds against the stable ABI of CPython 3.11 and later. Built by cargo, as the gates build the
# workspace, it needs a Python interpreter of at least 3.11 (`python3` on the path, or the one `PYO3_PYTHON` names):
# its library and its tests link against that interpreter's shared library, which the tests embed when they run.
# Maturin builds the extension module unlinked, for any interpreter to load.

[workspace]
resolver = "3"
members = ["crates/kahlnws", "crates/kahlnws_capi", "crates/kahlnws_python", "crates/kahlnws_testing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
authors = ["Felix Kahle"]
repository = "https://github.com/FelixKahle/kahlnws"

[workspace.dependencies]
# Error enums: `Display` and `source()` derived from one message per variant: the library's `ProblemError`, the
# testing crate's breaches and the Python binding's `ArgumentError`. No `std` feature: the derive needs none.
thiserror = { version = "2.0.21", default-features = false }
# The library's tables keyed by a typed id, such as each node's net supply keyed by `NodeId`. `alloc` alone: the
# growable `TiVec`; neither `std` nor `serde` is wanted.
typed-index-collections = { version = "3.5.0", default-features = false, features = ["alloc"] }
# The library's id newtypes: their conversions from and to `usize`, and a `Debug` that names the type. Only the three
# derives used; its `std` feature serves derives the library does not use.
derive_more = { version = "2.1.1", default-features = false, features = ["from", "into", "debug"] }
# Iterator adaptors std lacks, where they state a walk better than std's: in the library `izip!` and `at_most_one`,
# in the testing crate `izip!`, `tuple_windows`, `iproduct!` and `zip_eq`. `use_std` alone, which is also its
# default, written out so that a later default adds nothing unseen.
itertools = { version = "0.15.0", default-features = false, features = ["use_std"] }
# Big integers, in which the library's range tests recompute every bound apart from the arithmetic under test. No
# `std`: the tests only compute, compare and convert.
num-bigint = { version = "0.5.1", default-features = false }
# The library, for the C boundary and the Python binding that wrap it.
kahlnws = { path = "crates/kahlnws" }
# The test infrastructure the tests of the library, the C boundary and the Python binding share: the plain networks,
# their strategies, the counting allocator.
kahlnws_testing = { path = "crates/kahlnws_testing" }
# Property tests against deliberately simple reference models, and the tiny-network strategies the testing crate
# shares among them. `std` alone: the runner and its failure persistence; the tests run in process, so neither `fork`
# nor `timeout` is wanted, and nothing uses the `bit-set` strategies.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The timing of the benchmark suites. No default feature: the suites read their numbers from the terminal and from the
# estimates criterion writes, so neither plots (`plotters`) nor parallel analysis (`rayon`) is wanted;
# `cargo_bench_support` switches on no code of this version.
criterion = { version = "0.8.2", default-features = false }
# Linear programs on an LP solver built from bundled sources with cmake: the oracle for the optimum cost of min-cost
# flows larger than a brute force enumerates. `highs` is that solver's backend; the oracle writes its model
# with plain methods, so neither `macros` nor `serde` is wanted.
culmen = { version = "0.2.1", default-features = false, features = ["highs"] }
# The generator of every seeded substream the sized networks draw from: `Xoshiro256PlusPlus`, seeded by
# `SplitMix64`. Its `serde` is not wanted.
rand_xoshiro = { version = "0.8.1", default-features = false }
# Ranges and partial shuffles drawn from those generators. `unbiased` makes every drawn range exactly uniform, so a
# network depends on its seed alone and never on a sampling shortcut. No default features of its own: every generator
# is seeded explicitly. `proptest` switches on `std` and the system generator for its own runner; no seeded network
# draws from them.
rand = { version = "0.10.3", default-features = false, features = ["unbiased"] }
# The writer of the C boundary crate's header, run by its build script from the crate's sources: a build-dependency
# of that crate alone, none of whose code is linked into any library (MPL-2.0, the one licence exception
# `docs/style.md` names). No default feature: `clap` serves its command line, which the build script does not use.
cbindgen = { version = "0.29.4", default-features = false }
# The Python binding's bridge to the interpreter: its classes, methods, functions, module and exception, written with
# the attribute macros of `macros`, and the buffer protocol. `abi3-py311` builds one extension for every CPython from
# 3.11 on, the first version whose stable ABI holds the buffer protocol. Maturin builds it for no interpreter in
# particular; cargo links it against the interpreter it finds, which therefore must exist.
pyo3 = { version = "0.30.1", default-features = false, features = ["macros", "abi3-py311"] }
# The Python binding's columns seen as the bytes a buffer is copied in as, and its staging room, a column of `u64`
# words, seen as a column of narrower integers; checked casts only, so no feature is wanted.
bytemuck = { version = "1.25.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_panics_doc = "deny"
missing_errors_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"

# Own code stays debuggable in dev builds while dependencies are optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
