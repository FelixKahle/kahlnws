[package]
name = "kahlnws_python"
description = "The Python binding of kahlnws: its solver and network as the extension module of the package `kahlnws`"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The extension module `kahlnws._kahlnws`, which maturin builds and packs beside the package's Python files. Built
# by cargo, as the workspace's gates build it, the crate and its tests link against the shared library of a Python
# interpreter of at least 3.11 (`python3` on the path, or the one `PYO3_PYTHON` names), which the tests embed.
[lib]
crate-type = ["cdylib"]

[dependencies]
# The solver and the network the extension calls.
kahlnws = { workspace = true }
# The classes, methods, functions, module and exception of the extension, the conversions of Python values, the
# buffer protocol.
pyo3 = { workspace = true }
# The columns and the staging room seen as bytes, which a buffer is copied in as, and the staging room seen as a column
# of the item type it holds.
bytemuck = { workspace = true }
# The `Display` of `ArgumentError`, `NotBelowCount` and `BalancedByItself`, one message per variant.
thiserror = { workspace = true }

[dev-dependencies]
# The counting allocator, for the tests that a reserved solver's `solve_into`, and a network's loads, changes, solves,
# copies and writes into buffers, allocate on the Rust heap nothing beyond the export records of the buffers they are
# handed.
kahlnws_testing = { workspace = true }
