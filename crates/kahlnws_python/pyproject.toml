# The Python package `kahlnws`: the Python files under `python/kahlnws/` and the extension module `kahlnws._kahlnws`
# this crate builds, packed into one wheel by maturin. `check.sh` beside this file builds it and runs the type check
# and the tests. Built by maturin, the extension needs no Python interpreter of a given version: one wheel serves
# CPython 3.11 and later, with the GIL. Built by cargo, as the workspace's gates build it, the crate links against the
# shared library of a Python interpreter of at least 3.11, `python3` on the path or the one `PYO3_PYTHON` names.

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "kahlnws"
description = "A primal network simplex for the min-cost flow problem on exact integers"
# The package's own page on the index: what it is, how to install it, the smallest call, and where the documents are.
readme = "README.md"
# The version is the workspace's, which maturin reads from `Cargo.toml`.
dynamic = ["version"]
# 3.11: the first version whose stable ABI holds the buffer protocol, which reads NumPy arrays and `array.array`
# without NumPy; the annotations need no more than 3.10.
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
# The two licence texts, linked into this folder from the workspace's root and packed into the wheel.
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Felix Kahle" }]
keywords = ["min-cost flow", "network simplex", "optimization", "graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# No dependency: plain sequences of `int` need nothing more.
dependencies = []

[project.urls]
Repository = "https://github.com/FelixKahle/kahlnws"
Documentation = "https://github.com/FelixKahle/kahlnws/blob/main/docs/python-api.md"
Changelog = "https://github.com/FelixKahle/kahlnws/blob/main/CHANGELOG.md"
Issues = "https://github.com/FelixKahle/kahlnws/issues"

[project.optional-dependencies]
# NumPy, for callers who hold their tables as arrays. The package itself never imports it: it reads any buffer. The
# lowest version is the one `check.sh` tests on the oldest interpreter.
numpy = ["numpy>=2.4.6"]

[tool.maturin]
# The package's Python files: `__init__.py`, the stubs of the extension module and the marker `py.typed`.
python-source = "python"
module-name = "kahlnws._kahlnws"

# The tools `check.sh` runs; none of them is a dependency of the package.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["python/kahlnws", "tests", "examples"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# NumPy is imported after the test module is skipped where it is not installed.
"tests/test_numpy.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["kahlnws", "networks"]
