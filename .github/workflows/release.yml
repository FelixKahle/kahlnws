# A release: pushing the tag `v<version>` publishes the crate `kahlnws` to crates.io and the Python package `kahlnws`
# to PyPI. Neither registry is handed a stored secret: each job that publishes proves to its registry who it is with a
# short-lived token GitHub issues for this workflow (trusted publishing), within an environment of its own, which
# the repository's settings can guard with a required review. `docs/releasing.md` has the one-time setup and the
# steps of a release.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The newest stable toolchain: the workspace names no Rust version.
  RUST_TOOLCHAIN: stable
  # The interpreter the wheels are tested on; one wheel serves every CPython from 3.11 on.
  PYTHON_VERSION: "3.13"

jobs:
  version:
    name: The tag names the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with the workspace's version
        run: |
          version="$(cargo pkgid --locked -p kahlnws | sed 's/.*[#@]//')"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "the tag $GITHUB_REF_NAME does not name the version $version" >&2
            exit 1
          }

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  crate:
    name: Package the crate
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Builds the crate from its packed sources alone, as a user of the registry will.
      - run: cargo publish --locked --dry-run -p kahlnws

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { name: macos-arm64, os: macos-latest, target: aarch64, manylinux: auto, test: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64, manylinux: auto, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/kahlnws_python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out dist
      # The wheels that run on the machine that built them are installed and tested before anything is published.
      - name: Test the wheel
        if: matrix.test
        working-directory: crates/kahlnws_python
        run: |
          python -m pip install --find-links dist --no-index kahlnws
          python -m pip install pytest numpy
          python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.name }}
          path: crates/kahlnws_python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/kahlnws_python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: crates/kahlnws_python/dist/*.tar.gz
          if-no-files-found: error

  publish-crate:
    name: Publish to crates.io
    needs: [checks, crate, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked -p kahlnws
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-python:
    name: Publish to PyPI
    needs: [checks, crate, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/kahlnws/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
